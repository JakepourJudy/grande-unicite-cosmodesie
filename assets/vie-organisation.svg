<rect x="180" y="374" width="358" height="58" rx="12" fill="#f2e7ce"/>
<text x="359" y="399" text-anchor="middle" font-size="19" font-weight="600">Maintien et renouvellement</text>
<text x="359" y="421" text-anchor="middle" font-size="15">composants · frontières · couplages</text>
<path d="M233 334 V365 M479 365 V334" stroke="#a57a36" stroke-width="2" fill="none" marker-end="url(#gold)"/>
