<rect width="1000" height="600" fill="#fbfcf8"/>
<g font-family="system-ui, sans-serif" fill="#173b39">
<text x="42" y="45" font-size="14" letter-spacing="2" fill="#527367">UN SYSTÈME OUVERT · UNE CONTINUITÉ ORGANISÉE</text>
