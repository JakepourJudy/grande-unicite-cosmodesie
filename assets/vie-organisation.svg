<rect x="679" y="260" width="235" height="157" rx="22" fill="#e1ede3" stroke="#34796b"/>
<text x="796" y="300" text-anchor="middle" font-size="20" font-weight="600">Suite de l’histoire</text>
<text x="796" y="333" text-anchor="middle" font-size="17">messages transmis</text>
<text x="796" y="361" text-anchor="middle" font-size="17">moyens renouvelés</text>
<text x="796" y="389" text-anchor="middle" font-size="17">successeurs</text>
<path d="M796 174 V248" stroke="#34796b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="499" y="505" text-anchor="middle" font-size="17" fill="#43645b">Les dépendances se décrivent à chaque échelle et à chaque génération.</text>
<text x="42" y="573" font-size="14" fill="#527367">Cadre conceptuel Xavier Endres × Judy Velune · Synthèse du 16 octobre 2026</text>
