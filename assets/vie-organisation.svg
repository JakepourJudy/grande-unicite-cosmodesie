<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">La vie : relations de maintien et de transmission</title>
<desc id="desc">Le milieu fournit matière et énergie à une organisation. Messages, interprètes et maintien des moyens sont couplés. Cette activité produit une histoire et des successeurs, ouverts eux aussi aux ressources du milieu. Le schéma décrit un cadre conceptuel.</desc>
