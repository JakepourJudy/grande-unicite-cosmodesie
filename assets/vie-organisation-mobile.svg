<svg xmlns="http://www.w3.org/2000/svg" width="450" height="720" viewBox="0 0 450 720" role="img" aria-labelledby="title desc">
<title id="title">La vie : maintien et transmission, lecture verticale</title>
<desc id="desc">Le milieu fournit matière et énergie à une organisation. Messages et interprètes contribuent au maintien et au renouvellement des moyens de continuer. La suite de l’histoire reste ouverte aux ressources et aux partenaires du milieu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#34796b" stroke-width="1.5"/></marker></defs>
