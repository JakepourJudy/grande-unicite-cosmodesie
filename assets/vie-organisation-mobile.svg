<text x="225" y="581" text-anchor="middle" font-size="16">messages transmis · moyens renouvelés</text>
<text x="225" y="607" text-anchor="middle" font-size="17">successeurs</text>
<text x="25" y="687" font-size="13" fill="#527367">Cadre conceptuel Xavier Endres × Judy Velune</text>
