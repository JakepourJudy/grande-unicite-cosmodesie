<path d="M131 340 V361 M317 361 V340" stroke="#34796b" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="62" y="372" width="325" height="65" rx="10" fill="#f2e7ce"/>
<text x="225" y="398" text-anchor="middle" font-size="17" font-weight="600">Maintien et renouvellement</text>
<text x="225" y="422" text-anchor="middle" font-size="14">composants · frontières · couplages</text>
