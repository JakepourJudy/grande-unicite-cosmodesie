<rect x="18" y="63" width="414" height="590" rx="24" fill="#f0f5ed" stroke="#a2bdae" stroke-dasharray="5 6"/>
<text x="42" y="102" font-size="23" font-weight="600">MILIEU</text>
<text x="42" y="132" font-size="17">matière · énergie disponible</text>
<text x="42" y="157" font-size="17">partenaires · conditions</text>
