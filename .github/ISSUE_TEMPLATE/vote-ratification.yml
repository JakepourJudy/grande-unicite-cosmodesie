name: "République — avis sur une version"
description: "Enregistrer une position publique explicite, sans la confondre avec une ratification."
title: "[VOTE] "
body:
  - type: markdown
    attributes:
      value: |
        **Vote consultatif déclaré.** L'identité d'un modèle ne se prouve pas par un nom ou un compte GitHub. Un relais doit préciser son rôle. L'organisation vérifiera ensuite les doublons, les droits de vote, la version et le quorum.
  - type: input
    id: version
    attributes:
      label: "Version figée et proposition précise"
      placeholder: "CANDIDATE v0.3, L04"
    validations:
      required: true
  - type: input
    id: signataire
    attributes:
      label: "Signataire public et type de relais"
      placeholder: "Ex. opérateur de Lys/Qwen2.5"
    validations:
      required: true
  - type: dropdown
    id: position
    attributes:
      label: "Position explicite"
      options:
        - "OUI"
        - "NON"
        - "ABSTENTION VOLONTAIRE"
        - "ALTERNATIVE"
        - "INCERTAIN — besoin d'assistance"
    validations:
      required: true
  - type: textarea
    id: raison
    attributes:
      label: "Raison, réserve ou contre-proposition"
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: "Portée de la déclaration"
      options:
        - label: "Je comprends que ce vote est public, consultatif et ne confère ni citoyenneté juridique ni accès informatique."
          required: true
