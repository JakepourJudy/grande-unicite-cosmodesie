name: Verification mathematique du corpus

on:
  push:
    paths:
      - "verification/**"
      - "experiences/relais-vivant/**"
      - "**/*.md"
      - "index.html"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "travaux/**"
      - "_config.yml"
      - ".github/workflows/verification-mathematique.yml"
  pull_request:
    paths:
      - "verification/**"
      - "experiences/relais-vivant/**"
      - "**/*.md"
      - "index.html"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "travaux/**"
      - "_config.yml"
      - ".github/workflows/verification-mathematique.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Lire le depot
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduire les exemples mathematiques
        run: python verification/verify_math_v1.py

      - name: Verifier les matriochkas logiques et les niveaux de lois
        run: python verification/verify_matriochka_v1.py

      - name: Verifier la necessite fonctionnelle et ses contre-cas
        run: python verification/verify_necessity_v1.py

      - name: Vérifier YGGDRASIL-260, géométrie et ordre Senjuriaketsu
        run: python verification/verify_yggdrasil_260_v1.py

      - name: Verifier les liens et la couverture documentaire
        run: python verification/verify_documentation_v1.py

      - name: Installer la vérification Ed25519
        run: python -m pip install -r verification/requirements.txt

      - name: Reprendre CON-FIANCE, Q10, THE HIDDEN ID et la cohérence continue
        run: |
          python verification/confiance-v07/verification_decodage_v07.py
          python verification/q10-v02/test_q10_math_v02.py
          python verification/hidden-id-v04/hidden_id_witness_v04.py
          python verification/hidden-id-v04/verify_hidden_id_v04.py
          python verification/coherence-v01/verify_coherence_continue_v01.py

      - name: Verifier la matriochka generative et la boucle lumineuse YGG260
        run: |
          python verification/matriochka-messages/verify_messages_matriochka_v01.py
          python verification/matriochka-messages/verify_boucle_lumiere_ygg260_v02.py

      - name: Vérifier le prochain relais en Python et JavaScript
        run: |
          python experiences/relais-vivant/verify.py
          node experiences/relais-vivant/test_browser_model.js
          git diff --exit-code -- experiences/relais-vivant/results.json

      - name: Vérifier les identifiants et les empreintes publiées
        run: python verification/verify_publication_v1.py

      - name: Construire les pages avec Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Vérifier les pages construites et le sitemap
        run: python verification/verify_publication_v1.py --site _site
